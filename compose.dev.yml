name: draftly-dev

x-app-environment: &app-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 4173
  DATABASE_URL: postgres://draftly:draftly@postgres:5432/draftly
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me-123456}
  BETTER_AUTH_URL: http://127.0.0.1:4173
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-local-placeholder}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-local-placeholder}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: draftly
  S3_ACCESS_KEY_ID: draftly
  S3_SECRET_ACCESS_KEY: draftly-local-secret
  S3_FORCE_PATH_STYLE: "true"
  DRAFTLY_WORKSPACES_DIR: /var/lib/draftly/workspaces

services:
  postgres:
    image: crpi-a01fov5fxhl285uu.cn-shanghai.personal.cr.aliyuncs.com/warjiang/postgres:17.6-bookworm
    environment:
      POSTGRES_DB: draftly
      POSTGRES_USER: draftly
      POSTGRES_PASSWORD: draftly
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftly -d draftly"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: crpi-a01fov5fxhl285uu.cn-shanghai.personal.cr.aliyuncs.com/warjiang/minio-minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: draftly
      MINIO_ROOT_PASSWORD: draftly-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: crpi-a01fov5fxhl285uu.cn-shanghai.personal.cr.aliyuncs.com/warjiang/minio-mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 draftly draftly-local-secret && mc mb --ignore-existing local/draftly
    restart: "no"

  migrate:
    build:
      context: .
      target: development
    environment: *app-environment
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node-modules-dev:/app/node_modules
    restart: "no"

  app:
    build:
      context: .
      target: development
    init: true
    environment:
      <<: *app-environment
      DRAFTLY_PI_COMMAND: ${DRAFTLY_PI_COMMAND:-pi}
      DRAFTLY_PI_PROVIDER: ${DRAFTLY_PI_PROVIDER:-}
      DRAFTLY_PI_MODEL: ${DRAFTLY_PI_MODEL:-}
      DRAFTLY_PI_THINKING: ${DRAFTLY_PI_THINKING:-medium}
    ports:
      - "4173:4173"
    volumes:
      - .:/app
      - node-modules-dev:/app/node_modules
      - workspace-dev:/var/lib/draftly/workspaces
      - ${PI_CONFIG_DIR:-./.draftly/pi}:/home/node/.pi:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-dev:
  minio-dev:
  node-modules-dev:
  workspace-dev:
