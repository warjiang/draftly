<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>draftly · 设计草稿</title>
<link rel="stylesheet" href="/drafts.css" />
</head>
<body>
<header id="topbar">
  <div class="brand">draftly <span class="tag">设计草稿</span></div>
  <form id="gen-form">
    <input id="gen-input" type="text" placeholder="描述你想要的页面，如：做一个深色科技感的 SaaS 定价页" autocomplete="off" />
    <select id="gen-style" title="风格预设（来自模板库）">
      <option value="">默认风格</option>
    </select>
    <select id="gen-variants" title="同时生成的方案数">
      <option value="1">1 个方案</option>
      <option value="2">2 个方案</option>
      <option value="3" selected>3 个方案</option>
    </select>
    <button type="submit" class="btn primary" id="gen-btn">生成草稿</button>
  </form>
</header>

<main id="layout">
  <!-- 左：草稿列表 -->
  <aside id="sidebar">
    <div class="pane-title">草稿列表</div>
    <ul id="draft-list"></ul>
    <p id="list-empty" class="hint">还没有草稿，输入描述开始生成</p>
  </aside>

  <!-- 中：预览画布 -->
  <section id="stage">
    <div id="stage-empty" class="stage-hint">← 选择左侧草稿查看预览</div>
    <!-- 多变体并排对比（M4）：生成多个方案时展示，点击卡片选用 -->
    <div id="compare-view" hidden>
      <div class="pane-title compare-title">生成完成，点击选用一个方案（其余保留在草稿列表）</div>
      <div id="compare-grid"></div>
    </div>
    <div id="stage-view" hidden>
      <div id="stage-bar">
        <div>
          <div id="stage-title"></div>
          <div id="stage-meta" class="hint"></div>
        </div>
        <div class="stage-actions">
          <button id="btn-pick" class="btn" aria-pressed="false">点选修改</button>
          <button id="btn-source" class="btn">查看源码</button>
          <button id="btn-export" class="btn">导出 HTML</button>
        </div>
      </div>
      <iframe id="preview" title="draft preview" sandbox="allow-same-origin"></iframe>
    </div>
  </section>

  <!-- 右：选中元素 + 对话迭代 + 版本历史 -->
  <aside id="rightbar">
    <div class="pane-title">选中元素</div>
    <p id="selected-empty" class="hint">未选中。开启「点选修改」后在预览中点击元素。</p>
    <div id="selected-info" hidden>
      <div id="selected-summary"></div>
      <form id="element-form">
        <textarea id="element-input" rows="2" placeholder="对选中元素的指令，如：换成描边样式"></textarea>
        <button type="submit" class="btn primary" id="element-btn">修改选中元素</button>
      </form>
    </div>
    <div class="pane-title" style="margin-top:16px">整页迭代</div>
    <form id="iterate-form">
      <textarea id="iterate-input" rows="3" placeholder="输入修改指令，如：导航栏改成毛玻璃"></textarea>
      <button type="submit" class="btn primary" id="iterate-btn">迭代当前草稿</button>
    </form>
    <div class="pane-title" style="margin-top:16px">截图修改</div>
    <div id="image-drop" class="image-drop" tabindex="0" role="button" aria-label="选择或粘贴截图">
      <input type="file" id="image-file" accept="image/*" hidden />
      <p class="hint" id="image-drop-hint">点击选择 / 粘贴图片（Ctrl+V），照着截图改</p>
      <img id="image-preview" alt="参考截图预览" hidden />
    </div>
    <form id="image-form">
      <textarea id="image-input" rows="2" placeholder="按截图修改，如：照着截图把首屏改成这样"></textarea>
      <button type="submit" class="btn primary" id="image-btn">按截图修改</button>
    </form>
    <div class="pane-title" style="margin-top:16px">版本历史</div>
    <ul id="version-list"></ul>
  </aside>
</main>

<!-- 源码弹层 -->
<div id="source-modal" hidden>
  <div id="source-box">
    <div class="pane-title">HTML 源码 <button id="btn-close-source" class="btn">关闭</button></div>
    <pre id="source-view"></pre>
  </div>
</div>

<script type="module" src="/drafts-app.js"></script>
</body>
</html>
