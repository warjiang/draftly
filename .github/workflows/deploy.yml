name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag, for example sha-1a2b3c4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$DEPLOY_PATH'"
          scp compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.prod.yml"
          printf '%s\nDRAFTLY_IMAGE_TAG=%s\n' "$PRODUCTION_ENV" "${{ inputs.image_tag }}" > /tmp/draftly-production.env
          scp /tmp/draftly-production.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.production"
      - name: Deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_USERNAME: ${{ secrets.GHCR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USERNAME' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
            docker compose --env-file .env.production -f compose.prod.yml pull && \
            docker compose --env-file .env.production -f compose.prod.yml run --rm migrate && \
            docker compose --env-file .env.production -f compose.prod.yml up -d --remove-orphans"
      - name: Verify readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
            for attempt in \$(seq 1 40); do \
              if docker compose --env-file .env.production -f compose.prod.yml exec -T app \
                node -e \"fetch('http://127.0.0.1:4173/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"; then \
                exit 0; \
              fi; \
              sleep 3; \
            done; \
            docker compose --env-file .env.production -f compose.prod.yml logs --tail=200 app; \
            exit 1"
      - name: Deployment summary
        run: echo "Deployed \`${{ inputs.image_tag }}\` to the production environment." >> "$GITHUB_STEP_SUMMARY"
